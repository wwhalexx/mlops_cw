[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toxic-mlops"
version = "1.0.0"
description = "Reproducible Russian toxic comment classifier and HTTP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "scikit-learn==1.7.2",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "joblib==1.5.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
train = ["pandas==2.3.3", "mlflow==2.22.0", "sqlalchemy==2.0.41", "alembic==1.15.2"]
ui = ["streamlit==1.45.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.10"]

[project.scripts]
toxic-mlops = "toxic_mlops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toxic_mlops"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["toxic_mlops"]
omit = ["*/ui.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
